name: Build and publish Foundry module
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier panneau scores SRD des Pillards
        run: node tests/creature-pillards-scores.mjs
      - name: Validate JavaScript and manifest
        run: |
          node --check scripts/h0d-template-manager.js
          node --check scripts/h0d-attacks.js
          node --check scripts/h0d-common-stats.js
          node --check scripts/h0d-ammo-recovery.js
          node tests/template-manager-audit-workflow.mjs
          node tests/ammo-recovery.mjs
          node tests/h0d-attacks-smoke.mjs
          node tests/gameplay-automation.mjs
          node tests/perception-detection.mjs
          node tests/common-health-bar.mjs
          node tests/common-actor-interface.mjs
          node tests/creature-size-field.mjs
          node tests/h0d-level-up.mjs
          node tests/pj-skills-craft.mjs
          node tests/pj-skill-take-10-20.mjs
          node tests/creature-ability-rolls.mjs
          node tests/creature-faction-scores.mjs
          node tests/creature-ordinary-npc-level.mjs
          node tests/creature-heroic-scores.mjs
          python3 -m json.tool module.json > /dev/null
      - name: Package and publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json;print(json.load(open("module.json"))["version"])')
          TAG="$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 0; fi
          zip -q -r h0d-template-manager.zip module.json scripts styles data templates reference README.md CHANGELOG.md VALIDATION.txt
          gh release create "$TAG" h0d-template-manager.zip module.json --target "$GITHUB_SHA" --title "H0D-template-manager $TAG" --notes-file CHANGELOG.md
